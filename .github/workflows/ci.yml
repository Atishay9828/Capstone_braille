name: Braillix CI

on:
  push:
    branches: [ main, "backend/**", "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "pytest (ubuntu / system python3)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # python-louis is NOT on PyPI for Linux — install via apt alongside liblouis.
      # This installs liblouis C library + Python bindings in one step.
      - name: Install liblouis + Python bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            liblouis-dev \
            liblouis-data \
            python3-louis \
            python3-pip

      - name: Install nemeth.ctb compatibility wrapper
        run: |
          # Ubuntu's apt python3-louis binding has no listTables(); locate the
          # tables dir from the installed liblouis-data package instead.
          TABLES_DIR=$(dpkg -L liblouis-data 2>/dev/null | grep -m1 '/tables$' || echo /usr/share/liblouis/tables)
          echo "Using tables dir: $TABLES_DIR"
          if [ ! -f "$TABLES_DIR/nemeth.ctb" ]; then
            sudo cp scripts/nemeth.ctb "$TABLES_DIR/nemeth.ctb"
            echo "Installed nemeth.ctb wrapper → $TABLES_DIR/nemeth.ctb"
          else
            echo "nemeth.ctb already present"
          fi

      # Install pip deps EXCEPT:
      #   - python-louis (installed via apt above)
      #   - the heavy Phase 2 ML stack (pix2tex/torch/timm/einops) — the OCR
      #     tests mock pix2tex and ocr_service.py guards its import, so the
      #     suite stays green without it. Skipping saves ~750 MB + several
      #     minutes per run and avoids torch-wheel flakiness.
      - name: Install Python dependencies (excludes heavy OCR stack)
        run: |
          # Drop excluded packages and full-line comments, then strip any
          # inline "# ..." comments so pip receives clean specifiers only.
          pip install --break-system-packages \
            $(grep -vE "^python-louis|^#|^pix2tex|^torch|^timm|^einops" requirements.txt \
              | sed 's/#.*//' | tr '\n' ' ')

      - name: Verify liblouis + Nemeth
        run: |
          TABLES_DIR=$(dpkg -L liblouis-data 2>/dev/null | grep -m1 '/tables$' || echo /usr/share/liblouis/tables)
          python3 -c "
          import louis, os
          tables_dir = '$TABLES_DIR'
          print('liblouis version:', louis.version())
          files = set(os.listdir(tables_dir)) if os.path.isdir(tables_dir) else set()
          print('tables dir:', tables_dir)
          print('grade1 available:', 'en-us-g1.ctb' in files)
          print('nemeth available:', 'nemeth.ctb' in files)
          r = louis.translateString(
              [os.path.join(tables_dir, 'unicode.dis'), os.path.join(tables_dir, 'en-us-g1.ctb')],
              'hello',
          )
          print('Grade 1 test:', repr(r), 'cells:', len(r))
          "

      - name: Run full pytest suite
        run: |
          python3 -m pytest tests/ -v --tb=short 2>&1 | tee pytest-output.txt
          # Print summary line
          grep -E "passed|failed|error|skipped" pytest-output.txt | tail -1

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-output
          path: pytest-output.txt
          retention-days: 7
