<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="ui-sans-serif,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="340" fill="#12131f"/>
  <text x="24" y="32" fill="#e8eaf2" font-size="17" font-weight="700">The one real unknown: the latch</text>
  <text x="24" y="53" fill="#8d93b0" font-size="12">Each pin must HOLD its height after the cam head moves on — but still yield to a reading finger.</text>

  <rect x="24" y="68" width="666" height="34" rx="6" fill="#1e2138" stroke="#4a9eff" stroke-width="1.2"/>
  <text x="40" y="90" fill="#4a9eff" font-size="12.5">Target: hold ≈ 0.4 N against a reading force of only 5–15 g. Too weak = dots collapse. Too strong = the cam stalls.</text>

  <!-- silicone -->
  <g>
    <rect x="40" y="122" width="300" height="180" rx="8" fill="#181a2b" stroke="#4ecca3" stroke-width="1.5"/>
    <text x="190" y="146" fill="#4ecca3" font-size="12.5" font-weight="600" text-anchor="middle">A — SILICONE SLEEVE (friction)</text>
    <rect x="150" y="162" width="14" height="96" fill="#c9ced6"/>
    <circle cx="157" cy="160" r="7.5" fill="#c9ced6"/>
    <rect x="132" y="196" width="50" height="26" rx="5" fill="#e9a13b" opacity="0.85"/>
    <rect x="120" y="188" width="12" height="42" fill="#2b2f4d"/>
    <rect x="182" y="188" width="12" height="42" fill="#2b2f4d"/>
    <text x="230" y="205" fill="#e9a13b" font-size="10.5">silicone tube,</text>
    <text x="230" y="219" fill="#e9a13b" font-size="10.5">squeezes the pin</text>
    <text x="190" y="278" fill="#8d93b0" font-size="10.5" text-anchor="middle">~₹50 total · fully printable · no magnets</text>
    <text x="190" y="294" fill="#8d93b0" font-size="10.5" text-anchor="middle">force tuned by interference fit</text>
  </g>

  <!-- magnetic -->
  <g>
    <rect x="380" y="122" width="300" height="180" rx="8" fill="#181a2b" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="530" y="146" fill="#4a9eff" font-size="12.5" font-weight="600" text-anchor="middle">B — MAGNETIC DETENT</text>
    <rect x="490" y="162" width="14" height="96" fill="#c9ced6"/>
    <circle cx="497" cy="160" r="7.5" fill="#c9ced6"/>
    <rect x="486" y="200" width="22" height="9" fill="#e94560"/>
    <rect x="440" y="228" width="114" height="7" fill="#8d93b0"/>
    <text x="570" y="207" fill="#e94560" font-size="10.5">magnet on pin</text>
    <text x="570" y="240" fill="#8d93b0" font-size="10.5">steel plate</text>
    <text x="530" y="278" fill="#8d93b0" font-size="10.5" text-anchor="middle">~₹200 · more repeatable</text>
    <text x="530" y="294" fill="#8d93b0" font-size="10.5" text-anchor="middle">more parts, 24 magnets to place</text>
  </g>

  <text x="24" y="328" fill="#e8eaf2" font-size="12.5" font-weight="600">Test this on a 4-pin coupon BEFORE anything else is built. It is the single assumption the whole architecture rests on.</text>
</svg>
