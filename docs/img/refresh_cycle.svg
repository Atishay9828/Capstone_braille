<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="ui-sans-serif,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="300" fill="#12131f"/>
  <text x="24" y="32" fill="#e8eaf2" font-size="17" font-weight="700">Refresh cycle: why a reset bar is unavoidable</text>
  <text x="24" y="53" fill="#8d93b0" font-size="12">A cam can only PUSH. It cannot pull a latched pin back down. So every refresh is: wipe the line, then set it.</text>

  <g>
    <rect x="30" y="76" width="200" height="150" rx="8" fill="#181a2b" stroke="#2b2f4d"/>
    <text x="130" y="100" fill="#e94560" font-size="12" font-weight="600" text-anchor="middle">1 — RESET SWEEP</text>
    <rect x="52" y="118" width="156" height="9" rx="4" fill="#e94560" opacity="0.75"/>
    <path d="M130 132 L130 148" stroke="#e94560" stroke-width="2" marker-end="url(#d)"/>
    <g fill="#272b45">
      <circle cx="76" cy="176" r="5"/><circle cx="94" cy="176" r="5"/>
      <circle cx="76" cy="192" r="5"/><circle cx="94" cy="192" r="5"/>
      <circle cx="128" cy="176" r="5"/><circle cx="146" cy="176" r="5"/>
      <circle cx="128" cy="192" r="5"/><circle cx="146" cy="192" r="5"/>
      <circle cx="180" cy="176" r="5"/><circle cx="198" cy="176" r="5" opacity="0"/>
      <circle cx="180" cy="192" r="5"/>
    </g>
    <text x="130" y="216" fill="#8d93b0" font-size="10.5" text-anchor="middle">a bar pushes every pin flat</text>
  </g>

  <g>
    <rect x="252" y="76" width="200" height="150" rx="8" fill="#181a2b" stroke="#2b2f4d"/>
    <text x="352" y="100" fill="#4ecca3" font-size="12" font-weight="600" text-anchor="middle">2 — SET, CELL BY CELL</text>
    <circle cx="298" cy="132" r="16" fill="none" stroke="#e94560" stroke-width="2"/>
    <path d="M320 132 L360 132" stroke="#4ecca3" stroke-width="1.8" marker-end="url(#d2)"/>
    <g>
      <circle cx="290" cy="176" r="5" fill="#4ecca3"/><circle cx="308" cy="176" r="5" fill="#4ecca3"/>
      <circle cx="290" cy="192" r="5" fill="#4ecca3"/><circle cx="308" cy="192" r="5" fill="#272b45"/>
      <circle cx="342" cy="176" r="5" fill="#272b45"/><circle cx="360" cy="176" r="5" fill="#272b45"/>
      <circle cx="342" cy="192" r="5" fill="#272b45"/><circle cx="360" cy="192" r="5" fill="#272b45"/>
      <circle cx="394" cy="176" r="5" fill="#272b45"/><circle cx="412" cy="176" r="5" fill="#272b45"/>
      <circle cx="394" cy="192" r="5" fill="#272b45"/><circle cx="412" cy="192" r="5" fill="#272b45"/>
    </g>
    <text x="352" y="216" fill="#8d93b0" font-size="10.5" text-anchor="middle">cam lifts the pins; the latch holds them</text>
  </g>

  <g>
    <rect x="474" y="76" width="216" height="150" rx="8" fill="#181a2b" stroke="#2b2f4d"/>
    <text x="582" y="100" fill="#4ecca3" font-size="12" font-weight="600" text-anchor="middle">3 — HEAD LEAVES, LINE HOLDS</text>
    <g>
      <circle cx="512" cy="176" r="5" fill="#4ecca3"/><circle cx="530" cy="176" r="5" fill="#4ecca3"/>
      <circle cx="512" cy="192" r="5" fill="#4ecca3"/><circle cx="530" cy="192" r="5" fill="#272b45"/>
      <circle cx="564" cy="176" r="5" fill="#4ecca3"/><circle cx="582" cy="176" r="5" fill="#272b45"/>
      <circle cx="564" cy="192" r="5" fill="#272b45"/><circle cx="582" cy="192" r="5" fill="#272b45"/>
      <circle cx="616" cy="176" r="5" fill="#4ecca3"/><circle cx="634" cy="176" r="5" fill="#4ecca3"/>
      <circle cx="616" cy="192" r="5" fill="#272b45"/><circle cx="634" cy="192" r="5" fill="#4ecca3"/>
    </g>
    <text x="582" y="132" fill="#4ecca3" font-size="26" text-anchor="middle">✓</text>
    <text x="582" y="216" fill="#8d93b0" font-size="10.5" text-anchor="middle">zero power to hold the line</text>
  </g>

  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e94560"/></marker>
    <marker id="d2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4ecca3"/></marker>
  </defs>

  <text x="24" y="258" fill="#e8eaf2" font-size="13" font-weight="600">Estimated timing</text>
  <text x="24" y="277" fill="#8d93b0" font-size="12">~1.5–2 s per cell (dominated by cam rotation, not traverse). 4 cells ≈ 8 s · 8 cells ≈ 15 s per line.</text>
  <text x="24" y="294" fill="#8d93b0" font-size="12">Acceptable for reading a maths line you set once. NOT acceptable for continuous scrolling — state this honestly.</text>
</svg>
