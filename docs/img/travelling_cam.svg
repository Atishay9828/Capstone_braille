<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="ui-sans-serif,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="400" fill="#12131f"/>
  <text x="24" y="32" fill="#e8eaf2" font-size="17" font-weight="700">The travelling cam: one mechanism, many cells</text>
  <text x="24" y="53" fill="#8d93b0" font-size="12">The cam stops being part of a cell. It becomes a setting head that moves along a line of latching pins.</text>

  <!-- belt -->
  <circle cx="86" cy="120" r="17" fill="none" stroke="#8d93b0" stroke-width="2.5"/>
  <circle cx="634" cy="120" r="17" fill="none" stroke="#8d93b0" stroke-width="2.5"/>
  <line x1="86" y1="103" x2="634" y2="103" stroke="#8d93b0" stroke-width="2.5"/>
  <line x1="86" y1="137" x2="634" y2="137" stroke="#8d93b0" stroke-width="2.5"/>
  <text x="86" y="90" fill="#8d93b0" font-size="10.5" text-anchor="middle">motor 2</text>
  <text x="660" y="124" fill="#8d93b0" font-size="10.5">idler</text>

  <!-- carriage -->
  <g>
    <rect x="228" y="86" width="126" height="70" rx="7" fill="#1e2138" stroke="#e94560" stroke-width="2"/>
    <circle cx="291" cy="121" r="24" fill="none" stroke="#e94560" stroke-width="2.5"/>
    <circle cx="291" cy="121" r="15" fill="none" stroke="#e94560" stroke-width="1.4" opacity="0.6"/>
    <circle cx="291" cy="121" r="7" fill="none" stroke="#e94560" stroke-width="1.4" opacity="0.4"/>
    <text x="291" y="176" fill="#e94560" font-size="11.5" text-anchor="middle" font-weight="600">CAM HEAD  (motor 1)</text>
    <text x="291" y="192" fill="#8d93b0" font-size="10">your existing Ø44 disc + 64-state encoding</text>
  </g>
  <path d="M368 121 L432 121" stroke="#4ecca3" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#4ecca3"/></marker></defs>
  <text x="400" y="112" fill="#4ecca3" font-size="10.5" text-anchor="middle">traverse</text>

  <!-- pin bank -->
  <line x1="60" y1="230" x2="660" y2="230" stroke="#2b2f4d" stroke-width="2"/>
  <g>
    <g id="cells">
      <!-- 4 cells x 6 pins -->
    </g>
  </g>
  <g fill="#8d93b0">
    <!-- cell 1 raised pattern, others flat -->
    <g>
      <circle cx="250" cy="214" r="5.5" fill="#4ecca3"/><circle cx="268" cy="214" r="5.5" fill="#4ecca3"/>
      <circle cx="250" cy="232" r="5.5" fill="#4ecca3"/><circle cx="268" cy="232" r="5.5" fill="#272b45"/>
      <circle cx="250" cy="250" r="5.5" fill="#272b45"/><circle cx="268" cy="250" r="5.5" fill="#272b45"/>
    </g>
    <g>
      <circle cx="318" cy="214" r="5.5" fill="#4ecca3"/><circle cx="336" cy="214" r="5.5" fill="#272b45"/>
      <circle cx="318" cy="232" r="5.5" fill="#272b45"/><circle cx="336" cy="232" r="5.5" fill="#272b45"/>
      <circle cx="318" cy="250" r="5.5" fill="#272b45"/><circle cx="336" cy="250" r="5.5" fill="#272b45"/>
    </g>
    <g opacity="0.45">
      <circle cx="386" cy="214" r="5.5" fill="#272b45"/><circle cx="404" cy="214" r="5.5" fill="#272b45"/>
      <circle cx="386" cy="232" r="5.5" fill="#272b45"/><circle cx="404" cy="232" r="5.5" fill="#272b45"/>
      <circle cx="386" cy="250" r="5.5" fill="#272b45"/><circle cx="404" cy="250" r="5.5" fill="#272b45"/>
    </g>
    <g opacity="0.45">
      <circle cx="454" cy="214" r="5.5" fill="#272b45"/><circle cx="472" cy="214" r="5.5" fill="#272b45"/>
      <circle cx="454" cy="232" r="5.5" fill="#272b45"/><circle cx="472" cy="232" r="5.5" fill="#272b45"/>
      <circle cx="454" cy="250" r="5.5" fill="#272b45"/><circle cx="472" cy="250" r="5.5" fill="#272b45"/>
    </g>
  </g>
  <text x="259" y="278" fill="#8d93b0" font-size="10.5" text-anchor="middle">cell 1</text>
  <text x="327" y="278" fill="#8d93b0" font-size="10.5" text-anchor="middle">cell 2</text>
  <text x="395" y="278" fill="#8d93b0" font-size="10.5" text-anchor="middle">cell 3</text>
  <text x="463" y="278" fill="#8d93b0" font-size="10.5" text-anchor="middle">cell 4</text>

  <line x1="241" y1="292" x2="481" y2="292" stroke="#4ecca3" stroke-width="1.4"/>
  <text x="361" y="308" fill="#4ecca3" font-size="11" text-anchor="middle">4 cells × 6.2 mm = 24.8 mm — real braille pitch</text>

  <line x1="24" y1="330" x2="696" y2="330" stroke="#2b2f4d"/>
  <text x="24" y="354" fill="#e8eaf2" font-size="13" font-weight="600">Why this escapes the wall</text>
  <text x="24" y="373" fill="#8d93b0" font-size="12">Each cell holds only 1.7 mm pins — nothing bulky sits at the cell. Actuator count stops scaling with cell count:</text>
  <text x="24" y="391" fill="#8d93b0" font-size="12">4 cells need 2 motors. So do 8. So do 20.</text>
</svg>
